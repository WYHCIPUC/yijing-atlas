<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-labelledby="title desc">
  <title id="title">易象图谱学习闭环</title>
  <desc id="desc">从观象、研读、小试、抽查、复讲到考评，再通过错题与间隔复习回到应用的学习机制。</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11172a"/>
      <stop offset="1" stop-color="#0c1120"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#8a7a5a"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="26" fill="#0a0e1a"/>
  <rect x="1" y="1" width="1198" height="558" rx="25" fill="none"
        stroke="#c9a96a" stroke-opacity="0.32" stroke-width="2"/>

  <g transform="translate(54 48)">
    <text x="0" y="0" fill="#c9a96a" font-size="16" letter-spacing="4"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LEARNING MECHANISM</text>
    <text x="0" y="52" fill="#f0e4ca" font-size="38" font-weight="650"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      学习不是读完，而是完成一次可回看的闭环
    </text>
    <text x="0" y="88" fill="#a89878" font-size="20"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      内容始终开放；检验只用于发现薄弱点、安排复习与形成个人掌握证据。
    </text>
  </g>

  <g id="learning-stages" transform="translate(50 172)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(0 0)">
      <rect width="160" height="126" rx="18" fill="url(#panel)" stroke="#c9a96a" stroke-opacity="0.38"/>
      <text x="18" y="28" fill="#8a7a5a" font-size="16" font-family="ui-monospace, monospace">01</text>
      <text x="18" y="64" fill="#e8d09a" font-size="27" font-weight="650">观象</text>
      <text x="18" y="94" fill="#a89878" font-size="18">星图 · 黄历日课</text>
    </g>
    <path d="M166 63h22" stroke="#8a7a5a" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(190 0)">
      <rect width="160" height="126" rx="18" fill="url(#panel)" stroke="#c9a96a" stroke-opacity="0.38"/>
      <text x="18" y="28" fill="#8a7a5a" font-size="16" font-family="ui-monospace, monospace">02</text>
      <text x="18" y="64" fill="#e8d09a" font-size="27" font-weight="650">研读</text>
      <text x="18" y="94" fill="#a89878" font-size="18">五阶开放课程</text>
    </g>
    <path d="M356 63h22" stroke="#8a7a5a" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(380 0)">
      <rect width="160" height="126" rx="18" fill="url(#panel)" stroke="#c9a96a" stroke-opacity="0.38"/>
      <text x="18" y="28" fill="#8a7a5a" font-size="16" font-family="ui-monospace, monospace">03</text>
      <text x="18" y="64" fill="#e8d09a" font-size="27" font-weight="650">小试</text>
      <text x="18" y="94" fill="#a89878" font-size="18">每小节 3 题</text>
    </g>
    <path d="M546 63h22" stroke="#8a7a5a" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(570 0)">
      <rect width="160" height="126" rx="18" fill="url(#panel)" stroke="#c9a96a" stroke-opacity="0.38"/>
      <text x="18" y="28" fill="#8a7a5a" font-size="16" font-family="ui-monospace, monospace">04</text>
      <text x="18" y="64" fill="#e8d09a" font-size="27" font-weight="650">抽查</text>
      <text x="18" y="94" fill="#a89878" font-size="18">已学内容 5 题</text>
    </g>
    <path d="M736 63h22" stroke="#8a7a5a" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(760 0)">
      <rect width="160" height="126" rx="18" fill="url(#panel)" stroke="#c9a96a" stroke-opacity="0.38"/>
      <text x="18" y="28" fill="#8a7a5a" font-size="16" font-family="ui-monospace, monospace">05</text>
      <text x="18" y="64" fill="#e8d09a" font-size="27" font-weight="650">复讲</text>
      <text x="18" y="94" fill="#a89878" font-size="18">以自己的话说明</text>
    </g>
    <path d="M926 63h22" stroke="#8a7a5a" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(950 0)">
      <rect width="160" height="126" rx="18" fill="url(#panel)" stroke="#34e89e" stroke-opacity="0.42"/>
      <text x="18" y="28" fill="#5b9f83" font-size="16" font-family="ui-monospace, monospace">06</text>
      <text x="18" y="64" fill="#b8ead4" font-size="27" font-weight="650">考评</text>
      <text x="18" y="94" fill="#a4c9b8" font-size="18">每阶段 10 题</text>
    </g>
  </g>

  <g id="mastery-feedback" transform="translate(50 336)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect width="1110" height="166" rx="20" fill="#11172a" stroke="#2a3050"/>
    <text x="24" y="38" fill="#e8d9b8" font-size="22" font-weight="650">个人掌握度</text>
    <text x="176" y="38" fill="#8a7a5a" font-size="18">不是排名，也不锁课；它只回答“下一步该学什么”。</text>

    <g transform="translate(24 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <rect width="106" height="38" rx="10" fill="#8a7a5a" fill-opacity="0.28"/>
      <text x="53" y="25" text-anchor="middle" fill="#d4bc8a">浏览 10%</text>
      <rect x="116" width="312" height="38" rx="10" fill="#c9a96a" fill-opacity="0.32"/>
      <text x="272" y="25" text-anchor="middle" fill="#e8d09a">小试 35%</text>
      <rect x="438" width="178" height="38" rx="10" fill="#c9a96a" fill-opacity="0.21"/>
      <text x="527" y="25" text-anchor="middle" fill="#d4bc8a">抽查 20%</text>
      <rect x="626" width="134" height="38" rx="10" fill="#b89ad0" fill-opacity="0.2"/>
      <text x="693" y="25" text-anchor="middle" fill="#d8c0e8">复讲 15%</text>
      <rect x="770" width="178" height="38" rx="10" fill="#34e89e" fill-opacity="0.16"/>
      <text x="859" y="25" text-anchor="middle" fill="#b8ead4">考评 20%</text>
    </g>

    <g transform="translate(24 128)" fill="#a89878" font-size="19">
      <text x="0" y="0">薄弱课程推荐</text>
      <text x="160" y="0" fill="#5a6680">→</text>
      <text x="194" y="0">错题回练</text>
      <text x="304" y="0" fill="#5a6680">→</text>
      <text x="338" y="0">间隔复习 0 / 1 / 2 / 4 / 7 / 15 / 30 / 60 天</text>
      <text x="781" y="0" fill="#5a6680">→</text>
      <text x="815" y="0" fill="#e8d09a">回到星图与情境应用</text>
    </g>
  </g>
</svg>
