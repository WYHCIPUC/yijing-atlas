<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>星图验证</title>
<style>body{margin:0;background:#0a0e1a;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head><body>
<canvas id="cv"></canvas>
<script type="module">
import { loadAllData } from './js/data-loader.js';
import { buildRelationGraph } from './js/star-relations.js';
import { StarMap } from './js/star-map.js';
try {
  const data = await loadAllData();
  const graph = buildRelationGraph(data.hexagrams);
  const sm = new StarMap(document.getElementById('cv'), graph, {
    onPick: (code) => { document.title = 'picked: ' + code; console.log('picked', code); },
    onHover: (code) => { console.log('hover', code); },
  });
  console.log('StarMap initialized OK, nodes:', graph.nodes.length, 'edges:', graph.edges.length);
} catch(e) { document.body.innerHTML = '<pre style="color:red;padding:20px">'+e.message+'\n'+e.stack+'</pre>'; }
</script></body></html>
