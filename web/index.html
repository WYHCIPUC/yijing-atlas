<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="以关系星图探索六十四卦，循序学习《易经》、十翼、象数与传统黄历知识。" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="易象图谱 · 六十四卦" />
  <meta property="og:description" content="以关系星图探索六十四卦，循序学习《易经》、十翼与象数知识。" />
  <title>易象图谱 · 六十四卦</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="loading-screen" id="loading">星辰排列中…</div>

  <!-- 今日卦首页欢迎层 -->
  <div class="daily-overlay" id="daily-overlay">
    <div class="daily-card" id="daily-card">
      <div class="daily-date" id="daily-date"></div>
      <div class="daily-hex-svg" id="daily-hex-svg"></div>
      <div class="daily-hex-name" id="daily-hex-name"></div>
      <div class="daily-hex-full" id="daily-hex-full"></div>
      <div class="daily-divider"></div>
      <div class="daily-verse" id="daily-verse"></div>
      <div class="daily-verse-src" id="daily-verse-src"></div>
      <button type="button" class="daily-enter" id="daily-enter">进入星图</button>
    </div>
  </div>

  <header class="topbar">
    <div class="brand-lockup" aria-label="易象图谱">
      <div class="logo">易象图谱</div>
      <div class="brand-subtitle">观象 · 读经 · 知变</div>
    </div>
    <nav class="mode-switcher" id="mode-switcher" aria-label="主要功能">
      <button type="button" class="mode-btn" data-mode="almanac" aria-pressed="false">黄历</button>
      <button type="button" class="mode-btn active" data-mode="explore" aria-pressed="true">探索</button>
      <button type="button" class="mode-btn" data-mode="learning" aria-pressed="false">学习</button>
      <button type="button" class="mode-btn" data-mode="review" aria-pressed="false">复习</button>
      <button type="button" class="mode-btn" data-mode="quiz" aria-pressed="false">测验</button>
      <button type="button" class="mode-btn" data-mode="divination" aria-pressed="false">占筮</button>
    </nav>
    <div class="search-box">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="搜索卦名…" aria-label="搜索六十四卦" autocomplete="off"
        role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" />
      <button type="button" class="audio-toggle" id="audio-toggle" aria-label="关闭界面音效"
        aria-pressed="true" title="关闭界面音效"><span aria-hidden="true">♪</span></button>
      <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果" hidden></div>
    </div>
  </header>

  <canvas id="star-canvas" tabindex="0" role="img" aria-label="六十四卦关系星图，可拖动、缩放并选择卦象">
    你的浏览器不支持星图画布。仍可通过搜索、学习、复习和黄历功能浏览内容。
  </canvas>

  <nav class="explore-tools" id="explore-tools" aria-label="探索功能" hidden>
    <button type="button" class="explore-tool active" data-explore-tool="star" aria-pressed="true">星图探索</button>
    <button type="button" class="explore-tool" data-explore-tool="evolution" aria-pressed="false">演变实验室</button>
    <button type="button" class="explore-tool guaxu-tool" data-explore-tool="guaxu" aria-pressed="false">卦序转盘</button>
  </nav>

  <aside class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-label="内容面板" aria-hidden="true" inert>
    <div class="detail-panel-tools">
      <label class="detail-layout-control">布局
        <select id="detail-layout" aria-label="详情面板布局">
          <option value="bottom">底部</option>
          <option value="left">左侧</option>
          <option value="right">右侧</option>
        </select>
      </label>
      <button type="button" class="detail-size" id="detail-size" aria-label="切换底部详情高度，当前：中等" title="调整抽屉高度">↕</button>
      <button type="button" class="detail-close" id="detail-close" aria-label="关闭内容面板">✕</button>
    </div>
    <div class="detail-content" id="detail-content"></div>
  </aside>

  <div class="hint-bar" id="hint" aria-live="polite">悬停星辰看见它的变化 · 点击进入经文</div>

  <div class="zoom-controls" role="group" aria-label="星图视图控制">
    <button type="button" class="zoom-btn" id="zoom-in" title="放大" aria-label="放大星图">＋</button>
    <div class="zoom-level" id="zoom-level">100%</div>
    <button type="button" class="zoom-btn" id="zoom-out" title="缩小" aria-label="缩小星图">－</button>
    <button type="button" class="zoom-btn" id="zoom-reset" title="重置缩放" aria-label="重置星图缩放">⊙</button>
    <button type="button" class="zoom-btn trail-clear" id="trail-clear" title="清除轨迹" aria-label="清除漫游轨迹">✕</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
