<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>易象图谱 · 六十四卦</title>
  <link rel="stylesheet" href="styles/main.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="loading-screen" id="loading">星辰排列中…</div>

  <!-- 今日卦首页欢迎层 -->
  <div class="daily-overlay" id="daily-overlay">
    <div class="daily-card" id="daily-card">
      <div class="daily-date" id="daily-date"></div>
      <div class="daily-hex-svg" id="daily-hex-svg"></div>
      <div class="daily-hex-name" id="daily-hex-name"></div>
      <div class="daily-hex-full" id="daily-hex-full"></div>
      <div class="daily-verse" id="daily-verse"></div>
      <div class="daily-verse-src" id="daily-verse-src"></div>
      <button class="daily-enter" id="daily-enter">进入星图</button>
    </div>
  </div>

  <header class="topbar">
    <div class="logo">易象图谱</div>
    <nav class="mode-switcher" id="mode-switcher">
      <button class="mode-btn active" data-mode="explore">探索</button>
      <button class="mode-btn" data-mode="review">复习</button>
      <button class="mode-btn" data-mode="quiz">测验</button>
      <button class="mode-btn" data-mode="divination">占筮</button>
      <button class="mode-btn" data-mode="almanac">黄历</button>
    </nav>
    <div class="search-box">
      <input id="search" type="search" placeholder="搜索卦名…" />
    </div>
  </header>

  <canvas id="star-canvas"></canvas>

  <aside class="detail-panel" id="detail-panel">
    <button class="detail-close" id="detail-close">✕</button>
    <div class="detail-content" id="detail-content"></div>
  </aside>

  <div class="hint-bar" id="hint">悬停星辰看见它的变化 · 点击进入经文</div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in" title="放大">＋</button>
    <div class="zoom-level" id="zoom-level">100%</div>
    <button class="zoom-btn" id="zoom-out" title="缩小">－</button>
    <button class="zoom-btn" id="zoom-reset" title="重置">⊙</button>
  </div>

  <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
